<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniel's Vocatio</title>
    <meta name="description" content="Portfolio and resume of Daniel, a data analyst specializing in business intelligence, data visualization, and statistical analysis." />
    <meta name="author" content="Daniel" />

    <meta property="og:title" content="Daniel's Vocatio" />
    <meta property="og:description" content="Portfolio and resume of Daniel, a data analyst specializing in business intelligence and data visualization." />
    <meta property="og:type" content="website" />
    <!-- Social preview image: place your image at `public/social.png` (1200x630 recommended) -->
    <meta property="og:image" content="/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social.png" />
    <link rel="image_src" href="/social.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
    <!-- Load fonts used only by the Reading page quotes -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Favicon and Touch Icons -->
    <!-- Place your `favicon.ico` in the `public/` folder (already present). Browsers will also request /favicon.ico by default. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <!-- Google tag (gtag.js).
         The library itself is NOT loaded here. Commands are queued on dataLayer
         and gtag.js is injected only after the visitor allows analytics, so an
         undecided or declining visitor produces no requests to Google at all.
         Loading is handled by src/lib/consent.ts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });

      gtag('js', new Date());
      gtag('config', 'G-QTLPC7Z0BL', { anonymize_ip: true });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
