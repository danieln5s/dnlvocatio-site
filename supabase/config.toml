# Local development configuration for `supabase start`.
# Production settings live in the Supabase dashboard; see docs/PHOTO-ACCESS-SETUP.md.

project_id = "dnlvocatio-site"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]   # `private` is deliberately NOT exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher: OTP emails land at http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
# OTP send attempts per hour, per project.
email_sent = 30
# Verification attempts (per 5 minutes, per IP).
token_verifications = 30
sign_in_sign_ups = 30

[auth.email.template.magic_link]
subject = "Your dnlvocatio.com photo access code"
content_path = "./supabase/templates/magic_link.html"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.photo]
verify_jwt = true
